services:
  - type: web
    name: swamp-tunes-bot
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false # set this in the Render dashboard (never commit your token)
      - key: GUILD_ID
        value: 337050121717940232 # THE SWAMP — instant slash-command registration
      - key: SPOTIFY_CLIENT_ID
        sync: false # optional; Spotify links also work keyless
      - key: SPOTIFY_CLIENT_SECRET
        sync: false # optional; Spotify links also work keyless
