services:
  - type: web
    name: swamp-tunes-bot
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DISCORD_TOKEN
        sync: false # set this in the Render dashboard (never commit your token)
      - key: SPOTIFY_CLIENT_ID
        sync: false # set in Render dashboard for Spotify link support
      - key: SPOTIFY_CLIENT_SECRET
        sync: false # set in Render dashboard for Spotify link support
